[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-config"
version = "0.2.0"
description = "Declarative technical indicators with validated plans and bounded streaming state."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=2.3.2,<3",
    "numpy>=2.2.6,<3",
    "pydantic>=2.10,<3",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6.130,<7",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pandas-stubs>=2.3,<3",
    "build>=1.2,<2",
    "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ta_config = ["py.typed"]

[tool.pytest.ini_options]
minversion = "9.0.2"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Isolated calculations and configuration tests.",
    "integration: End-to-end execution and installed-artifact checks.",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/data/binance_kline/raw"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/ta_config", "tests/typing_smoke.py"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["ta_config"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]
